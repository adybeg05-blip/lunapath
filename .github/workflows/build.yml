name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev automake

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Cache Android SDK/NDK and build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Pre-download OpenSSL (optional, build continues if it fails)
        continue-on-error: true
        run: |
          d=.buildozer/android/platform/build-arm64-v8a/packages/openssl
          mkdir -p "$d"
          curl -fL --retry 5 --retry-delay 5 --max-time 300 -o "$d/openssl-3.3.1.tar.gz" \
            https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz
          touch "$d/.mark-openssl-3.3.1.tar.gz"

      - name: Pin charset-normalizer (3.5+ ships an Android wheel that p4a cannot install)
        run: echo "charset-normalizer<3.5" > "$GITHUB_WORKSPACE/pip-constraints.txt"

      - name: Build debug APK
        shell: bash
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt
        run: |
          ok=0
          for i in 1 2 3; do
            if buildozer -v android debug 2>&1 | tee -a build.log; then ok=1; break; fi
            echo "Attempt $i failed, retrying" | tee -a build.log
            sleep 20
          done
          [ "$ok" = 1 ]

      - name: Save build log
        if: always()
        run: tail -n 1500 build.log > build-tail.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunapath-apk
          path: bin/*.apk

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-tail.log
          if-no-files-found: ignore
